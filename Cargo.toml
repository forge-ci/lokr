[package]
name = "lokr"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Local secrets catalog for AI agents: shows which keys exist and where, never their values."
license = "MIT"
readme = "README.md"
repository = "https://github.com/forge-ci/lokr"
authors = ["Zach Vorhies"]

[dependencies]
kernal-api = { version = "=0.1.41", default-features = false, features = ["json", "gfx-egui"] }

regex = "1"
zeroize = "1"
rpassword = "7"
tempfile = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[workspace]

[workspace.metadata.soldr]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[patch.crates-io]
kernal-api = { path = "../kernal-api" }
